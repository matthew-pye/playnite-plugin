name: Build and Package Extension

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Playnite 11 Toolbox
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Invoke-WebRequest `
            -Uri "https://playnite.link/download/Toolbox.exe" `
            -OutFile "tools/Toolbox.exe"

      - name: Restore dependencies
        run: dotnet restore source/Graviton.csproj

      - name: Build and package Graviton
        run: dotnet build source/Graviton.csproj --configuration Release --no-restore

      - name: Upload packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: Graviton-pext2
          path: source/bin/Release/*.pext2
          if-no-files-found: error
